<body>
  <div class="ambient" aria-hidden="true"></div>
  <main id="app" class="game" aria-label="Phoenix Reborn Game"><p id="startup-message" style="margin:auto;padding:30px;text-align:center;font-family:serif">Opening the palace gates…</p></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script>
    (() => {
      const app = document.getElementById('app');
      const showFailure = () => {
        if (!app.querySelector('#startup-message')) return;
        app.querySelector('#startup-message').textContent = 'The game could not start. Close and reopen the app to try again.';
      };
      window.addEventListener('error', event => {
        if (event.target.id === 'ios-game-script' || event instanceof ErrorEvent) showFailure();
      }, true);
      window.addEventListener('unhandledrejection', showFailure);
      setTimeout(showFailure, 15000);
    })();
  </script>
  <script id="ios-game-script" defer src="palace-ios.js"></script>
</body>
</html>
