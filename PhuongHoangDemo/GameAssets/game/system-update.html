<!doctype html><html lang="en" translate="no" class="notranslate"><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appearance System Update</title><style>body{margin:0;background:#f6ecd7;color:#703442;font:18px/1.6 system-ui;display:grid;min-height:100dvh;place-items:center}main{max-width:660px;margin:24px;padding:40px;border:2px solid #b79962;border-radius:24px;background:#fffbef}h1{font:700 32px Georgia}a{color:#703442}#status{font-weight:bold}.counts{font-size:15px;color:#756652}</style><main><small>PHOENIX REBORN · APPEARANCE UPDATE</small><h1>Appearance System Update</h1><p id="status" role="status">Updating appearances automatically…</p><p id="counts" class="counts"></p><p>Your progress, items, and equipped outfits will be preserved.</p><a href="/">Return to Game</a></main><script type="module">
const status=document.querySelector('#status'),counts=document.querySelector('#counts');
async function check(){try{const response=await fetch('/api/face-system-status',{cache:'no-store'});if(!response.ok)throw Error('Connection not ready');const r=await response.json();counts.textContent=`${r.processed} saves checked · ${r.changed} saves updated`+(r.errors?` · ${r.errors} saves need attention`:'');status.textContent=r.completed?(r.errors?'The update is complete. Some saves need attention.':'All server saves have been updated.'):'Applying the new appearances…';if(!r.completed)setTimeout(check,500);}catch{status.textContent='Reconnecting to the server…';setTimeout(check,3000);}}check();
</script></html>
